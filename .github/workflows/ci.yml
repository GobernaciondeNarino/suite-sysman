name: CI

# Lint de sintaxis PHP + tests unitarios standalone en cada push y PR.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax lint
        run: |
          set -e
          find . -name '*.php' -not -path './.claude/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "Sintaxis OK"

      - name: Run unit tests
        run: php tests/run-tests.php
